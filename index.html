<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>DZ-Tourism - Visit Algeria</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; color: #333; }
        .hero { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=1350&q=80'); height: 60vh; color: white; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
        .hero h1 { font-family: 'Georgia', serif; font-size: 3.5rem; color: #FFD700; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .section { padding: 50px 20px; text-align: center; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .rating { color: #f39c12; font-size: 1.2rem; }
        .booking-section { background: #f9f9f9; padding: 60px 20px; border-top: 5px solid #FFD700; }
        .form-card { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #FFD700; color: #333; padding: 15px; width: 100%; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class='hero'>
        <h1>DZ-Tourism</h1>
        <p>Discover the Golden Sahara Sunset</p>
    </div>
    <div class='section'>
        <h2>Top Hotels</h2>
        <div class='cards'>
            <div class='card'><h3>Hotel Sahara Palace</h3><div class='rating'>★★★★★</div><p>Luxury at the edge of the dunes.</p></div>
            <div class='card'><h3>Coast View Resort</h3><div class='rating'>★★★★☆</div><p>Mediterranean breeze and elegance.</p></div>
        </div>
    </div>
    <section class='booking-section'>
        <h2>Book Your Stay</h2>
        <div class='form-card'>
            <form>
                <input type='text' placeholder='Full Name' required>
                <input type='date' required>
                <button type='submit'>Book Now</button>
            </form>
        </div>
    </section>
</body>
</html>
