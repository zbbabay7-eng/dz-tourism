<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>DZ-Tourism</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; text-align: center; }
        .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1544161515-4ab6ce6db874?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80'); height: 400px; color: white; display: flex; align-items: center; justify-content: center; }
        .container { padding: 20px; }
    </style>
</head>
<body>
    <div class='hero'><h1>Visit Algeria</h1></div>
    <div class='container'>
        <h2>Discover Algeria</h2>
        <p>Explore the stunning desert sunsets, historic cities like Annaba, and our beautiful coastlines.</p>
    </div>

    <section class='booking-section' style='padding: 40px 20px; background: #f4f4f4;'>
        <h2>Book Your Trip</h2>
        <form id='bookingForm' style='max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px;'>
            <label>Destination:</label><br>
            <input type='text' required style='width: 100%; padding: 8px; margin-bottom: 10px;'><br>
            <label>Check-in Date:</label><br>
            <input type='date' required style='width: 100%; padding: 8px; margin-bottom: 10px;'><br>
            <button type='submit' style='background: #007bff; color: white; padding: 10px; width: 100%; border: none; cursor: pointer;'>Book Now</button>
        </form>
    </section>

</body>
</html>
